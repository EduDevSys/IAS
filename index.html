<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flujo de Trabajo IA</title>
<meta name="description" content="Asistente paso a paso para el análisis de información con distintas IA.">
<meta name="theme-color" content="#4F46E5">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" role="main"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="stepModal" class="modal-overlay" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle">¿En qué paso estás?</h3>
    <p class="modal-sub">Elige por dónde continuar. Los pasos ya hechos se muestran en verde, solo son de consulta.</p>
    <div class="step-options" id="stepOptions">
      <button class="step-option" data-action="pick-step" data-step="0">
        <span class="so-title">Paso 0</span>
        <span class="so-desc">No he hecho nada, necesito configurar mi IA</span>
      </button>
      <button class="step-option" data-action="pick-step" data-step="1">
        <span class="so-title">Paso 1</span>
        <span class="so-desc">Ya hice el paso 0, debo contextualizar</span>
      </button>
      <button class="step-option" data-action="pick-step" data-step="2">
        <span class="so-title">Paso 2</span>
        <span class="so-desc">Ya tengo el link o los links de sitios web</span>
      </button>
      <button class="step-option" data-action="pick-step" data-step="3">
        <span class="so-title">Paso 3</span>
        <span class="so-desc">Ayuda a Eva</span>
      </button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {
        /* si falla el registro, la app sigue funcionando normalmente */
      });
    });
  }
</script>
</body>
</html>
