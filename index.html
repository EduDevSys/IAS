<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flujo de Trabajo IA</title>
<meta name="description" content="Asistente paso a paso para el análisis de información con distintas IA.">
<meta name="theme-color" content="#4F46E5">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" role="main"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {
        /* si falla el registro, la app sigue funcionando normalmente */
      });
    });
  }
</script>
</body>
</html>
